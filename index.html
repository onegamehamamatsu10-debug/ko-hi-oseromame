
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>Unity Web Player | 豆でオセロしてみた！</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>

  <div id="unity-container">

    <div id="unity-fullscreen-container">

      <canvas
        id="unity-canvas"
        width="1080"
        height="1920"
        tabindex="-1"
      ></canvas>

      <div id="unity-loading-container">

        <div id="unity-loading-bar">

          <div id="unity-logo"></div>

          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>

        </div>

      </div>

    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">

      <div id="unity-logo-title-footer"></div>

      <div id="unity-fullscreen-button"></div>

      <div id="unity-build-title">
        豆でオセロしてみた！
      </div>

    </div>

  </div>

  <script>

    const canvas =
      document.querySelector("#unity-canvas");

    const fullscreenContainer =
      document.querySelector("#unity-fullscreen-container");

    const unityContainer =
      document.querySelector("#unity-container");

    const loadingContainer =
      document.querySelector("#unity-loading-container");

    const progressBarFull =
      document.querySelector("#unity-progress-bar-full");

    const fullscreenButton =
      document.querySelector("#unity-fullscreen-button");

    function unityShowBanner(message, type) {

      const warningBanner =
        document.querySelector("#unity-warning");

      const div =
        document.createElement("div");

      div.textContent = message;

      if (type === "error") {

        div.style.background = "#d9534f";
        div.style.color = "#ffffff";

      } else {

        div.style.background = "#f5d76e";
        div.style.color = "#222222";

      }

      div.style.padding = "10px";

      warningBanner.appendChild(div);

      warningBanner.style.display = "block";

      if (type !== "error") {

        setTimeout(function () {

          if (div.parentNode === warningBanner) {
            warningBanner.removeChild(div);
          }

          if (warningBanner.children.length === 0) {
            warningBanner.style.display = "none";
          }

        }, 5000);

      }

    }

    const buildUrl = "Build";

    const loaderUrl =
      buildUrl + "/完成豆.loader.js";

    const config = {

      arguments: [],

      dataUrl:
        buildUrl + "/完成豆.data.unityweb",

      frameworkUrl:
        buildUrl + "/完成豆.framework.js.unityweb",

      codeUrl:
        buildUrl + "/完成豆.wasm.unityweb",

      streamingAssetsUrl:
        "StreamingAssets",

      fullscreenElementID:
        "unity-fullscreen-container",

      companyName:
        "DefaultCompany",

      productName:
        "豆でオセロしてみた！",

      productVersion:
        "1.0",

      showBanner:
        unityShowBanner

    };

    /*
      描画解像度はUnity標準の設定を維持します。

      devicePixelRatioの固定や上限制限は行いません。

      matchWebGLToCanvasSizeも変更しません。
    */

    function updateGameLayout() {

      const viewportWidth =
        document.documentElement.clientWidth;

      const viewportHeight =
        window.visualViewport
          ? window.visualViewport.height
          : window.innerHeight;

      if (
        viewportWidth <= 0 ||
        viewportHeight <= 0
      ) {
        return;
      }

      const gameAspect = 1080 / 1920;

      let gameWidth = viewportWidth;
      let gameHeight = gameWidth / gameAspect;

      if (gameHeight > viewportHeight) {

        gameHeight = viewportHeight;
        gameWidth = gameHeight * gameAspect;

      }

      unityContainer.style.width =
        gameWidth + "px";

      unityContainer.style.height =
        gameHeight + "px";

      fullscreenContainer.style.width =
        "100%";

      fullscreenContainer.style.height =
        "100%";

    }

    updateGameLayout();

    window.addEventListener(
      "resize",
      updateGameLayout
    );

    window.addEventListener(
      "orientationchange",
      updateGameLayout
    );

    if (window.visualViewport) {

      window.visualViewport.addEventListener(
        "resize",
        updateGameLayout
      );

    }

    const script =
      document.createElement("script");

    script.src = loaderUrl;

    script.onload = function () {

      createUnityInstance(
        canvas,
        config,
        function (progress) {

          if (progress < 1) {

            loadingContainer.style.display =
              "block";

            progressBarFull.style.width =
              (100 * progress) + "%";

          } else {

            loadingContainer.style.display =
              "none";

          }

        }
      ).then(function (unityInstance) {

        fullscreenButton.onclick = function () {

          unityInstance.SetFullscreen(1);

        };

      }).catch(function (message) {

        unityShowBanner(
          String(message),
          "error"
        );

      });

    };

    script.onerror = function () {

      unityShowBanner(
        "Unityの読み込みファイルを取得できませんでした。",
        "error"
      );

    };

    document.body.appendChild(script);

  </script>

</body>
</html>
